name: Website CI

on:
  pull_request:
    branches:
      - main

jobs:
  test-deploy:
    name: Test Docusaurus build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ./website/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm i
        working-directory: ./website

      - name: Build website
        run: pnpm build
        working-directory: ./website

      - name: Install mdbook
        uses: taiki-e/install-action@v2
        with:
          tool: mdbook

      - name: Build developer guide
        run: mdbook build docs/
        working-directory: .

      - name: Install Zola
        run: curl -sSfL https://github.com/getzola/zola/releases/download/v0.23.6/zola-v0.23.6-x86_64-unknown-linux-gnu.tar.gz | sudo tar -xz -C /usr/local/bin
        working-directory: .

      # As the deploy builds it, into the website's build.
      - name: Build experimental site
        run: zola --root experimental/website build --output-dir "$GITHUB_WORKSPACE/website/build/experimental"
        working-directory: .

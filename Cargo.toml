[package]
name = "ashell-guido"
edition = "2024"
version = "0.1.0"

[dependencies]
guido = { path = "../guido" }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
hyprland = "0.4.0-beta.2"
niri-ipc = "25.11.0"
sysinfo = "0.37"
tokio = { version = "1", features = ["rt-multi-thread", "time", "net", "process", "sync", "io-util"] }
log = "0.4"
env_logger = "0.11"
itertools = "0.14"
unicode-segmentation = "1.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
hex_color = { version = "3", features = ["serde"] }
anyhow = "1.0.101"
freedesktop-icons = "0.4"
linicon-theme = "1.2.0"
pin-project-lite = "0.2"
tokio-stream = { version = "0.1", features = ["sync"] }
inotify = { version = "0.11", default-features = false, features = ["stream"] }
futures = "0.3"
zbus = { version = "5", default-features = false, features = ["tokio"] }
libpulse-binding = { version = "2.28", features = ["pa_v15"] }
udev = { version = "0.9", features = ["send", "sync"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "unstable"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
libc = "0.2.182"
pipewire = "0.9"
url = "2.5"
bytes = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }

[build-dependencies]
allsorts = "0.15"

[package]
name = "ashell-services"
description = "UI-agnostic backend services for ashell"
version = "0.11.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[features]
bluetooth = ["rfkill", "dep:anyhow", "dep:log", "dep:tokio", "dep:zbus", "tokio/time"]
rfkill = ["dep:anyhow", "dep:inotify", "dep:log", "dep:tokio", "tokio/process"]
serde = ["dep:serde"]
throttle = ["dep:pin-project-lite", "dep:tokio", "tokio/time"]
upower = ["throttle", "dep:anyhow", "dep:log", "dep:tokio", "dep:zbus"]

[dependencies]
futures = "0.3"
anyhow = { workspace = true, optional = true }
inotify = { workspace = true, optional = true }
log = { workspace = true, optional = true }
pin-project-lite = { version = "0.2.16", optional = true }
serde = { version = "1", default-features = false, features = ["derive"], optional = true }
tokio = { workspace = true, optional = true }
zbus = { workspace = true, optional = true }

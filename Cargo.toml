[workspace]
members = ["crates/ashell-config", "crates/ashell-i18n", "crates/ashell-services"]

[workspace.package]
repository = "https://github.com/MalpenZibo/ashell"
authors = ["Simone Camito (Zibo)"]
license = "GPL-3.0-or-later"
edition = "2024"
rust-version = "1.89"

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false }
hex_color = { version = "3", features = ["serde"] }
inotify = { version = "0.11.1", default-features = false, features = [
  "stream",
] }
log = { version = "0.4", features = [] }
serde = { version = "1.0", default-features = false }
tokio = { version = "1", default-features = false }
toml = "1"
zbus = { version = "6", default-features = false, features = ["tokio", "proxy", "service"] }

[package]
name = "ashell"
description = "A ready to go status bar for Wayland compositors"
homepage = "https://malpenzibo.github.io/ashell/"
repository.workspace = true
authors.workspace = true
license.workspace = true
version = "0.11.0"
edition.workspace = true
rust-version.workspace = true

[profile.release]
lto = "thin"
strip = true
opt-level = 3
panic = "abort"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"

[package.metadata.nfpm]
provides = ["ashell"]

[package.metadata.nfpm.overrides.deb]
depends = [
  "libxkbcommon0",
  "libwayland-client0",
  "libpipewire-0.3-0t64",
  "libpulse0",
  "libudev1",
  "dbus",
]
[package.metadata.nfpm.overrides.rpm]
depends = [
  "libxkbcommon",
  "libwayland-client",
  "pipewire-libs",
  "pulseaudio-libs",
  "systemd-libs",
  "dbus",
]

[dependencies]
ashell-config = { path = "crates/ashell-config" }
ashell-i18n = { path = "crates/ashell-i18n" }
ashell-services = { path = "crates/ashell-services", features = [
  "bluetooth",
  "rfkill",
  "throttle",
  "upower",
] }
iced = { package = "iced_layershell", git = "https://github.com/MalpenZibo/iced_layershell", tag = "v0.6.1", features = [
  "tokio",
  "advanced",
  "wgpu",
  "tiny-skia",
  "image",
  "svg",
  "canvas",
] }
iced_anim = "0.3"
chrono = { workspace = true, features = [
  "clock",
  "serde",
  "unstable-locales",
] }
hyprland = { git = "https://github.com/hyprland-community/hyprland-rs", branch = "master" }
serde = { workspace = true, features = ["derive"] }
sysinfo = { version = "0.39", features = ["linux-netdevs"] }
tokio = { workspace = true, features = ["fs", "io-util", "net", "process"] }
zbus.workspace = true
libpulse-binding = { version = "2.28", features = ["pa_v15"] }
log.workspace = true
flexi_logger = "0.31"
pipewire = "0.10"
itertools = "0.15"
unicode-segmentation = "1.13.2"
hex_color.workspace = true
anyhow.workspace = true
udev = { version = "0.9", features = ["send", "sync"] }
toml.workspace = true
freedesktop-icons = "0.4"
linicon-theme = "1.2.0"
serde_json = "1"
tokio-stream = { version = "0.1", default-features = false, features = [
  "sync",
] }
clap = { version = "4.5", default-features = false, features = [
  "std",
  "derive",
  "help",
] }
inotify.workspace = true
niri-ipc = "26.4"
reqwest = { version = "0.13", default-features = false, features = [
  "json",
  "rustls",
] }
url = "2.5.7"
signal-hook = "0.4.3"
signal-hook-tokio = { version = "0.4", features = ["futures-v0_3"] }
libc = "0.2.182"
# keep in sync with the fontdb version pulled transitively by iced_layershell
fontdb = { version = "0.23", features = ["fontconfig"] }
chrono-tz = "0.10.4"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
qrcode = { version = "0.14", default-features = false }

[dev-dependencies]
regex = "1.12.2"

[patch.crates-io]
# Patched softbuffer that uses wl_shm Argb8888 so the tiny-skia fallback
# renderer honors alpha on Wayland (upstream hardcodes Xrgb8888, which
# makes translucent backgrounds render opaque). Pinned to a branch off
# v0.4.8 to match the release iced_tiny_skia 0.14 depends on.
softbuffer = { git = "https://github.com/MalpenZibo/softbuffer", branch = "wayland-argb" }

[build-dependencies]
allsorts = "0.17"

[package.metadata.rpm]
package = "ashell"

[package.metadata.rpm.cargo]
buildflags = ["--release"]

[package.metadata.rpm.targets]
ashell = { path = "/usr/bin/ashell" }

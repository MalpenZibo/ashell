name: Copr Build

on:
  workflow_dispatch:
  push:
    tags:
      - "*.*.*"

jobs:
  copr:
    runs-on: ubuntu-latest
    container:
      image: fedora:44
    env:
      COPR_CONFIG: ${{ secrets.COPR_CONFIG }}
    steps:
      - uses: actions/checkout@v7
      - name: Install deps
        run: |
          dnf -y install git cargo rust rpm-build copr-cli gcc make pkgconf-pkg-config \
            pipewire-devel libinput-devel systemd-devel dbus-devel wayland-devel \
            libxkbcommon-devel mesa-libEGL-devel pango-devel cairo-devel glib2-devel \
            openssl-devel fontconfig-devel freetype-devel clang-devel llvm-devel \
            pulseaudio-libs-devel
          dnf -y clean all
      - name: Configure copr-cli
        if: env.COPR_CONFIG != ''
        run: |
          mkdir -p ~/.config
          printf "%s" "$COPR_CONFIG" > ~/.config/copr
          chmod 600 ~/.config/copr
      - name: Extract version and release
        run: |
          {
            echo "VERSION=$(awk -F'"' '/^version = /{print $2; exit}' Cargo.toml)"
            # Monotonic release so repeated builds of the same tag stay upgradable.
            echo "RELEASE=${GITHUB_RUN_NUMBER}"
          } >> "$GITHUB_ENV"
      - name: Build release binary
        run: cargo build --release
      - name: Prepare source archive
        run: |
          mkdir -p rpmbuild/SOURCES
          STAGE=/tmp/ashell-${VERSION}
          rm -rf "${STAGE}"
          mkdir -p "${STAGE}/usr/bin" "${STAGE}/usr/share/licenses/ashell"
          cp -a target/release/ashell "${STAGE}/usr/bin/"
          cp -a LICENSE "${STAGE}/usr/share/licenses/ashell/"
          tar -C /tmp -czf "rpmbuild/SOURCES/ashell-${VERSION}.tar.gz" "ashell-${VERSION}"
      - name: Build SRPM
        id: srpm
        run: |
          sed -i "s/@@VERSION@@/${VERSION}/; s/@@RELEASE@@/${RELEASE}/" .rpm/ashell.spec
          rpmbuild -bs \
            --define "_topdir $(pwd)/rpmbuild" \
            --define "_sourcedir $(pwd)/rpmbuild/SOURCES" \
            --define "_srcrpmdir $(pwd)/rpmbuild/SRPMS" \
            --define "_specdir $(pwd)" \
            .rpm/ashell.spec
          echo "path=$(ls -1 rpmbuild/SRPMS/*.src.rpm | head -n1)" >> "$GITHUB_OUTPUT"
      - name: Trigger Copr build
        if: env.COPR_CONFIG != ''
        run: copr-cli build killcrb/ashell "${{ steps.srpm.outputs.path }}"
      - name: List builds
        if: env.COPR_CONFIG != ''
        run: copr-cli list-builds killcrb/ashell

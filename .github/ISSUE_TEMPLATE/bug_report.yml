name: Bug report
description: Something in ashell is broken or behaves unexpectedly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug!
        Please check the [troubleshooting guide](https://malpenzibo.github.io/ashell/docs/configuration/troubleshooting) and search [existing issues](https://github.com/MalpenZibo/ashell/issues) first.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect instead? Include how to trigger it if you know.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: ashell version
      description: Output of `ashell -V`
      placeholder: ashell 0.11.0 (8623dfb1)
    validations:
      required: true

  - type: textarea
    id: system
    attributes:
      label: System information
      description: |
        Output of `fastfetch --logo none --pipe` (OS, compositor, GPU, drivers).
        If you don't have fastfetch installed, list your distro, compositor and version, and GPU manually.
      render: text
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: Configuration
      description: Relevant parts of `~/.config/ashell/config.toml`. Leave empty if you use the default config.
      render: toml

  - type: upload
    id: logs
    attributes:
      label: Log file
      description: |
        ashell always writes a log file, so no setup is needed. Attach the file from the run
        that had the issue (drag & drop or click the field):

        - `$XDG_RUNTIME_DIR/ashell_rCURRENT.log`, or `/tmp/ashell/ashell_rCURRENT.log` when
          `$XDG_RUNTIME_DIR` is not a private per-user directory

        It holds warnings and errors, which is usually enough. If it says nothing about the
        problem, restart ashell from a terminal with `RUST_LOG=debug ashell`, reproduce the bug,
        and attach that log file instead.

        `.log`, `.txt` and `.zip` files up to 25 MB are accepted — if several rotated
        `ashell_r*.log` files are relevant, zip them together and attach the archive.
    validations:
      required: false
      accept: ".log,.txt,.zip"

  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Screenshots, recordings, or anything else that helps.

  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I'm willing to work on a fix for this
